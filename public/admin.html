<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#14361f">
<title>Pedidos | Verde Vivo</title><link rel="stylesheet" href="css/style.css">
<style>
body{background:#f5f7f1;color:#183321}.admin{width:min(1100px,calc(100% - 32px));margin:48px auto}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}.admin h1{font-size:clamp(2rem,5vw,3rem);margin:0}.admin-card{background:#fff;border:1px solid #e2e9df;border-radius:20px;padding:22px;box-shadow:0 12px 36px #14361f0d}.admin-form{display:flex;gap:10px;flex-wrap:wrap}.admin-form input{flex:1;min-width:220px;padding:14px;border:1px solid #cbd8ca;border-radius:12px;font:inherit}.admin button{border:0;border-radius:12px;padding:13px 18px;background:#1d6b3a;color:#fff;font:inherit;font-weight:700;cursor:pointer}.admin-status{color:#5c6b5d;min-height:24px;margin:12px 0}.orders{display:grid;gap:14px;margin-top:18px}.order{border:1px solid #e1e8df;border-radius:16px;padding:18px;background:#fff}.order-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.order h2{font-size:1.1rem;margin:0}.order p{margin:8px 0;color:#506052}.order ul{margin:8px 0;padding-left:20px}.total{font-size:1.15rem;font-weight:800;color:#1d6b3a}.empty{padding:30px;text-align:center;color:#667568}@media(max-width:600px){.admin{margin:28px auto}.admin-card{padding:16px}}
</style>
</head>
<body>
<main class="admin">
  <div class="admin-head"><div><p class="eyebrow">VERDE VIVO · GESTÃO</p><h1>Pedidos da loja</h1></div><a href="/" class="btn ghost">Voltar à loja</a></div>
  <section class="admin-card" aria-label="Acesso administrativo">
    <form id="login" class="admin-form"><label class="sr" for="token">Token administrativo</label><input id="token" type="password" autocomplete="current-password" placeholder="Token administrativo" required><button type="submit">Acessar pedidos</button></form>
    <p id="status" class="admin-status" role="status">Informe o token administrativo para consultar os pedidos.</p>
    <div id="orders" class="orders"></div>
  </section>
</main>
<script src="js/admin.js"></script>
</body></html>
